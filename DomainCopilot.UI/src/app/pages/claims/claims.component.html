<div>

  <div class="mb-4">

    <h2 class="fw-bold">
      Claims
    </h2>

    <p class="text-muted">
      Insurance claims available for your tenant.
    </p>

  </div>

  <div
    *ngIf="loading"
    class="alert alert-info"
  >
    Loading claims...
  </div>

  <div
    *ngIf="errorMessage"
    class="alert alert-danger"
  >
    {{ errorMessage }}
  </div>

  <div class="card border-0 shadow-sm">

    <div class="card-body">

      <table class="table table-hover align-middle mb-0">

        <thead>

          <tr>
            <th>Claim</th>
            <th>Policy</th>
            <th>Incident Date</th>
            <th>Claimed Amount</th>
            <th></th>
          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let claim of claims">

            <td>
              {{ claim.claimNumber }}
            </td>

            <td>
              {{ claim.policyNumber }}
            </td>

            <td>
              {{ claim.incidentDate | date }}
            </td>

            <td>
              {{ claim.claimedAmount | number }}
            </td>

            <td class="text-end">

              <button
                class="btn btn-sm btn-primary"
                (click)="openClaim(claim.claimId)"
              >
                View
              </button>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
